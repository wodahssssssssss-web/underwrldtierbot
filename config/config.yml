# bot requires a restart after any changes here

# ── Options ────────────────────────────────────────────────────────────────────
options:
    cooldown_days: 7          # days a player must wait before re-queuing
    booster_cooldown_days: 3  # reduced cooldown for players with the booster role below
    queue_limit: 20           # max players in a queue at once (keep under ~40)
    tester_limit: 5           # max testers open per gamemode at once
    reload_queue: 30          # seconds between live queue embed refreshes (keep above 15)
    db_sync_interval_hours: 1 # how often to pull the website's tiers into the local DB

# ── Messages ───────────────────────────────────────────────────────────────────
messages:
    no_permission:       "You do not have permission to use this command."
    not_ticket_category: "This command can only be used inside a testing ticket channel."
    result_sent:         "Result message sent!"
    error:               "An error occurred, please try again."
    added_to_queue:      "You have been added to the queue!"
    tester_opened_queue: "You have opened the queue!"
    already_in_queue:    "You are already in the queue!"
    queue_full:          "The queue is full!"
    not_in_queue:        "You are not in the queue!"
    left_queue:          "You have left the queue!"

# ── Roles (names, not IDs — must match your server exactly) ───────────────────
roles:
    tester:   "Verified Tester"    # required to run /openqueue, /next, /result, etc.
    staff:    "staff"     # also allowed to run staff commands
    waitlist: "waitlist"  # generic role granted when a player joins any queue
    booster:  "Server Booster"   # gets the reduced cooldown below

# ── Global channels (names, not IDs) ──────────────────────────────────────────
channels:
    announcements: "🏆results"  # /result posts placement embeds here
    verify:        "✅verify"              # /setupqueue posts the Verify panel here
    join_queue:    "💡request-test"          # /setupqueue posts the gamemode picker here
    tester_logs:   "tester-logs"          # ticket transcripts are posted here when a ticket closes

# ── Ticket settings ────────────────────────────────────────────────────────────
tickets:
    category: "Testing Tickets"         # category that /next creates ticket channels in
    channel_template: "test-{ign}-{gamemode}"  # {ign} and {gamemode} are replaced at runtime

# ── High-tier tickets ──────────────────────────────────────────────────────────
# Players holding one of these tiers skip the queue and get a direct ticket.
high_tiers:
    - HT1
    - LT1
    - HT2
    - LT2
    - HT3
high_ticket_category: "High-Tier Tests"  # separate category for these tickets

# ── Tier ordering (higher rank first) ─────────────────────────────────────────
# Used to pick the "best" tier for a player's nickname when they hold multiple.
tier_order:
    - HT1
    - LT1
    - HT2
    - LT2
    - HT3
    - LT3
    - HT4
    - LT4
    - HT5
    - LT5

# ── Gamemodes ──────────────────────────────────────────────────────────────────
# Each gamemode needs:
#   display       — shown in slash-command choices and embeds
#   emoji         — shown next to the gamemode name in embeds
#   queue_channel — Discord channel NAME where the live queue embed is posted
#   role_ping     — Discord role NAME to ping when the queue opens
#
# Tier roles per gamemode are auto-named as "<display> <tier>",
# e.g. "Sword PvP HT3".  Make sure those roles exist in your server.
# Waitlist roles per gamemode are auto-named as "Waitlist <display>",
# e.g. "Waitlist Sword PvP".
gamemodes:
    sword:
        display:       "Sword"
        emoji:         "⚔️"
        queue_channel: "🗡sword-waitlist"
        role_ping:     "Waitlist Sword"
    axe:
        display:       "Axe"
        emoji:         "🪓"
        queue_channel: "🪓axe-waitlist"
        role_ping:     "Waitlist Axe"
    mace:
        display:       "Mace PvP"
        emoji:         "🔨"
        queue_channel: "⚒mace-waitlist"
        role_ping:     "Waitlist Mace PvP"
    crystal:
        display:       "Crystal PvP"
        emoji:         "💎"
        queue_channel: "💎crystal-waitlist"
        role_ping:     "Waitlist Crystal PvP"
    uhc:
        display:       "UHC"
        emoji:         "🍎"
        queue_channel: "🍊uhc-waitlist"
        role_ping:     "Waitlist UHC"
    smp:
        display:       "SMP PvP"
        emoji:         "🏕️"
        queue_channel: "🧿smp-pvp-waitlist"
        role_ping:     "Waitlist SMP PvP"
    cart:
        display:       "Cart PvP"
        emoji:         "🛒"
        queue_channel: "🛒cart-waitlist"
        role_ping:     "Waitlist Cart PvP"
    netherite:
        display:       "Netherite Pot"
        emoji:         "🔥"
        queue_channel: "🧪netherite-waitlist"
        role_ping:     "Waitlist Netherite Pot"
    pot:
        display:       "Diamond Pot"
        emoji:         "🧪"
        queue_channel: "🌡pot-waitlist"
        role_ping:     "Waitlist Diamond Pot"
    diamondsmp:
        display:       "Diamond SMP"
        emoji:         "💠"
        queue_channel: "💠diamondsmp-waitlist"
        role_ping:     "Waitlist Diamond SMP"
    spearmace:
        display:       "Spear Mace"
        emoji:         "🔱"
        queue_channel: "🔱spearmace-waitlist"
        role_ping:     "Waitlist Spear Mace"

# ── Queue channels category ────────────────────────────────────────────────────
# All gamemode queue channels will sit inside this Discord category.
# Set to null to place them at the top level with no category.
queue_category: "Waitlists"

# ── Database ───────────────────────────────────────────────────────────────────
# options: "sqlite"  (default, no setup needed)
#          "mysql"   (only if you know what you're doing — data won't transfer if you switch)
database:
    type: sqlite
    mysql:
        host:     localhost
        port:     3306
        user:     root
        password: root
        database: tiers   # must exist before starting the bot
